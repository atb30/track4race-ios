name: Transfer Location4Race signing configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Copy encrypted configuration to Location4Race
        env:
          GH_TOKEN: ${{ secrets.LOCATION4RACE_TRANSFER_TOKEN }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TEAM_ID"
          test -n "$ISSUER_ID"
          test -n "$KEY_ID"
          test -n "$PRIVATE_KEY"
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          printf '%s' "$TEAM_ID" | gh variable set APPLE_TEAM_ID --repo atb30/Location4Race
          printf '%s' "$ISSUER_ID" | gh variable set APPSTORE_ISSUER_ID --repo atb30/Location4Race
          printf '%s' "$KEY_ID" | gh variable set APPSTORE_API_KEY_ID --repo atb30/Location4Race
          printf '%s' "$PRIVATE_KEY" | gh secret set APPSTORE_API_PRIVATE_KEY --repo atb30/Location4Race
          printf '%s' "$CERTIFICATE" | gh secret set APPSTORE_CERTIFICATES_FILE_BASE64 --repo atb30/Location4Race
          printf '%s' "$CERTIFICATE_PASSWORD" | gh secret set APPSTORE_CERTIFICATES_PASSWORD --repo atb30/Location4Race
