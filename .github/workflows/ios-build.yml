name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Versión de Xcode instalada
        run: xcodebuild -version

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la web (bundle que se empaqueta en la app)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://track4race.com

      - name: Añadir plataforma iOS (si no existe)
        run: test -d ios || npx cap add ios

      - name: Sincronizar Capacitor (copia dist/ + CocoaPods)
        run: npx cap sync ios

      - name: Generar iconos desde resources/icon.png
        run: npx @capacitor/assets generate --ios

      # --- Camino A: todavía sin cuenta de Apple Developer -> build de Simulador ---
      - name: "Build sin firmar para el Simulador"
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 == '' }}
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -derivedDataPath ../../build \
            CODE_SIGNING_ALLOWED=NO build

      - name: "Arrancar Simulador, instalar y capturar pantalla"
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 == '' }}
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl create "Track4Race-CI" "iPad (10th generation)")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find build -name "App.app" -path "*iphonesimulator*" | head -n1)
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" com.track4race.viewer
          sleep 8
          mkdir -p artifacts
          xcrun simctl io "$UDID" screenshot artifacts/simulador.png
          xcrun simctl shutdown "$UDID"

      - name: "Subir build de Simulador + captura"
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: |
            artifacts/simulador.png
            build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: warn

      # --- Camino B: ya hay cuenta de Apple Developer -> firmar y subir a TestFlight ---
      - name: "Importar certificado y perfil de aprovisionamiento"
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PP_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/

      - name: "Archivar y exportar .ipa"
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath ../../build/App.xcarchive DEVELOPMENT_TEAM="$TEAM_ID" archive

          cat > ../../build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive -archivePath ../../build/App.xcarchive \
            -exportPath ../../build/export -exportOptionsPlist ../../build/ExportOptions.plist

      - name: "Subir a TestFlight"
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          IPA_PATH=$(find build/export -name "*.ipa" | head -n1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: "Subir .ipa como artefacto"
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/export/*.ipa
          if-no-files-found: warn
