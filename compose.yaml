services:
  mirat:
    build: .
    container_name: mirat
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Solo accesible desde el propio VPS. Expón la app con un proxy HTTPS.
      - "127.0.0.1:3001:3001"
    volumes:
      - mirat_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Motor opcional: se activa con `docker compose --profile routing up -d`.
  # Requiere colocar el extracto de Castilla y León procesado en ./data/valhalla.
  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    profiles: [routing]
    restart: unless-stopped
    volumes:
      - ./data/valhalla:/custom_files
    command: ["valhalla_service", "/custom_files/valhalla.json", "1"]
    expose:
      - "8002"

volumes:
  mirat_data:
